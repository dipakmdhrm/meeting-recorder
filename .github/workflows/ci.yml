name: CI

on:
  pull_request:
    branches: [main]

jobs:
  # ── Python lint + type check ────────────────────────────────────────────────
  #
  # ruff enforces lint + formatting repo-wide; mypy runs in strict mode on the
  # headless packages (processing/, services/, config/ — see pyproject.toml).
  lint-python:
    name: Python lint + type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff and mypy
        run: pip install ruff mypy

      - name: ruff lint
        run: ruff check linux/

      - name: ruff format check
        run: ruff format --check linux/

      - name: mypy (strict packages)
        run: >-
          mypy
          linux/src/meeting_recorder/processing
          linux/src/meeting_recorder/services
          linux/src/meeting_recorder/config

  # ── Unit tests ──────────────────────────────────────────────────────────────
  #
  # Runs on every PR.  No system dependencies required — all shell/network
  # calls are replaced with fakes via the services' dependency-injection hooks.
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: pip install pytest pytest-cov

      - name: Run tests (with coverage)
        run: >-
          pytest --tb=short
          --cov=meeting_recorder
          --cov-report=term
          --cov-report=xml:coverage.xml

      # Report-only for now — no threshold gate. The artifact makes coverage
      # visible per PR so regressions in the extracted core/ modules show up.
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-${{ matrix.python-version }}
          path: coverage.xml

  # ── Package build smoke tests ───────────────────────────────────────────────
  #
  # Verifies that the packaging toolchain produces a structurally valid
  # artifact for each supported distro family.  Each job runs inside a
  # matching distro container so the native build tools are available.
  package-build:
    name: Build ${{ matrix.pkg }} package
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: deb
            container: ubuntu:24.04
          - pkg: rpm
            container: fedora:41
          - pkg: pacman
            container: archlinux:latest
    container: ${{ matrix.container }}

    steps:
      # ── deb ────────────────────────────────────────────────────────────────

      - name: Install deb build tools
        if: matrix.pkg == 'deb'
        run: apt-get update -qq && apt-get install -y --no-install-recommends dpkg-dev

      - uses: actions/checkout@v6
        if: matrix.pkg == 'deb'

      - name: Build .deb
        if: matrix.pkg == 'deb'
        run: |
          STAGING=$(mktemp -d)
          mkdir -p "$STAGING/DEBIAN"
          mkdir -p "$STAGING/opt/meeting-recorder/linux/src"
          mkdir -p "$STAGING/usr/bin"
          mkdir -p "$STAGING/usr/share/applications"

          cp -r linux/src/. "$STAGING/opt/meeting-recorder/linux/src/"
          cp linux/requirements.txt "$STAGING/opt/meeting-recorder/"
          # Ship the pinned lock file; postinst prefers it for reproducible venvs.
          cp linux/requirements.lock "$STAGING/opt/meeting-recorder/"
          cp linux/packaging/usr/bin/meeting-recorder "$STAGING/usr/bin/meeting-recorder"
          chmod 755 "$STAGING/usr/bin/meeting-recorder"
          cp linux/packaging/usr/share/applications/io.github.dipakmdhrm.MeetingRecorder.desktop \
             "$STAGING/usr/share/applications/io.github.dipakmdhrm.MeetingRecorder.desktop"

          ICONS_SRC="linux/src/meeting_recorder/assets/icons/hicolor"
          for size in 16 24 32 48 64 128 256; do
            dest="$STAGING/usr/share/icons/hicolor/${size}x${size}/apps"
            mkdir -p "$dest"
            cp "$ICONS_SRC/${size}x${size}/apps/meeting-recorder.png" "$dest/meeting-recorder.png"
          done
          mkdir -p "$STAGING/usr/share/icons/hicolor/scalable/apps"
          cp "$ICONS_SRC/scalable/apps/meeting-recorder.svg" \
             "$STAGING/usr/share/icons/hicolor/scalable/apps/meeting-recorder.svg"

          for f in postinst prerm postrm; do
            cp "linux/packaging/DEBIAN/$f" "$STAGING/DEBIAN/$f"
            chmod 755 "$STAGING/DEBIAN/$f"
          done

          # Use the same control template as the release workflow so CI
          # exercises the real Depends line (catches dependency drift).
          sed "s/@VERSION@/0.0.0/" linux/packaging/DEBIAN/control.template \
            > "$STAGING/DEBIAN/control"

          dpkg-deb --build "$STAGING" meeting-recorder.deb

      - name: Verify .deb structure
        if: matrix.pkg == 'deb'
        run: |
          dpkg --info meeting-recorder.deb
          dpkg --contents meeting-recorder.deb | grep -q "usr/bin/meeting-recorder"
          dpkg --contents meeting-recorder.deb | grep -q "opt/meeting-recorder/linux/src"
          dpkg --contents meeting-recorder.deb | grep -q "opt/meeting-recorder/requirements.lock"
          dpkg --contents meeting-recorder.deb | grep -q "usr/share/applications/io.github.dipakmdhrm.MeetingRecorder.desktop"
          dpkg --contents meeting-recorder.deb | grep -q "usr/share/icons/hicolor/256x256/apps/meeting-recorder.png"
          echo "All required paths present in .deb"

      # Install the package with its real Depends line and import the app the
      # same way the launcher does.  Fails if the control template ever drifts
      # from the runtime requirements (e.g. GTK4/libadwaita typelibs).
      - name: Install .deb and import smoke test
        if: matrix.pkg == 'deb'
        run: |
          apt-get update -qq
          apt-get install -y ./meeting-recorder.deb
          PYTHONPATH=/opt/meeting-recorder/linux/src \
            /opt/meeting-recorder/venv/bin/python - <<'EOF'
          import gi
          gi.require_version("Gtk", "4.0")
          gi.require_version("Adw", "1")
          from gi.repository import Gtk, Adw
          import google.genai
          import meeting_recorder
          print("GTK4 + Adw typelibs, venv deps, and app package all import OK")
          EOF

      # ── rpm ────────────────────────────────────────────────────────────────

      - name: Install rpm build tools
        if: matrix.pkg == 'rpm'
        run: dnf install -y git rpm-build

      - uses: actions/checkout@v6
        if: matrix.pkg == 'rpm'

      - name: Build .rpm
        if: matrix.pkg == 'rpm'
        run: |
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

          SRCDIR=$(mktemp -d)
          mkdir "${SRCDIR}/meeting-recorder-0.0.0"
          cp -r linux "${SRCDIR}/meeting-recorder-0.0.0/"
          tar -czf rpmbuild/SOURCES/meeting-recorder-0.0.0.tar.gz \
            -C "${SRCDIR}" meeting-recorder-0.0.0

          CHANGELOG_DATE=$(date "+%a %b %d %Y")
          sed -e "s/@VERSION@/0.0.0/g" \
              -e "s/@CHANGELOG_DATE@/${CHANGELOG_DATE}/g" \
              linux/packaging/rpm/meeting-recorder.spec > rpmbuild/SPECS/meeting-recorder.spec

          rpmbuild --define "_topdir ${PWD}/rpmbuild" -bb rpmbuild/SPECS/meeting-recorder.spec

      - name: Verify .rpm structure
        if: matrix.pkg == 'rpm'
        run: |
          rpm -qlp rpmbuild/RPMS/noarch/*.rpm | grep -q /usr/bin/meeting-recorder
          rpm -qlp rpmbuild/RPMS/noarch/*.rpm | grep -q /opt/meeting-recorder/linux/src
          rpm -qlp rpmbuild/RPMS/noarch/*.rpm | grep -q /opt/meeting-recorder/requirements.lock
          rpm -qlp rpmbuild/RPMS/noarch/*.rpm | grep -q /usr/share/applications/io.github.dipakmdhrm.MeetingRecorder.desktop
          rpm -qlp rpmbuild/RPMS/noarch/*.rpm | grep -q /usr/share/icons/hicolor/256x256/apps/meeting-recorder.png
          echo "All required paths present in .rpm"

      # ── pacman ─────────────────────────────────────────────────────────────

      - name: Install pacman build tools
        if: matrix.pkg == 'pacman'
        run: pacman -Syu --noconfirm git base-devel

      - uses: actions/checkout@v6
        if: matrix.pkg == 'pacman'

      - name: Build pacman package
        if: matrix.pkg == 'pacman'
        run: |
          mkdir -p arch-build

          SRCDIR=$(mktemp -d)
          mkdir "${SRCDIR}/meeting-recorder-0.0.0"
          cp -r linux "${SRCDIR}/meeting-recorder-0.0.0/"
          tar -czf arch-build/meeting-recorder-0.0.0.tar.gz \
            -C "${SRCDIR}" meeting-recorder-0.0.0

          sed "s/@VERSION@/0.0.0/g" linux/packaging/arch/PKGBUILD > arch-build/PKGBUILD
          cp linux/packaging/arch/meeting-recorder.install arch-build/

          useradd -m builder
          chown -R builder:builder arch-build
          su builder -c "cd arch-build && makepkg --noconfirm --skipinteg --nodeps"

      - name: Verify pacman package structure
        if: matrix.pkg == 'pacman'
        run: |
          bsdtar -tf arch-build/*.pkg.tar.zst | grep -q usr/bin/meeting-recorder
          bsdtar -tf arch-build/*.pkg.tar.zst | grep -q opt/meeting-recorder/linux/src
          bsdtar -tf arch-build/*.pkg.tar.zst | grep -q opt/meeting-recorder/requirements.lock
          bsdtar -tf arch-build/*.pkg.tar.zst | grep -q usr/share/applications/io.github.dipakmdhrm.MeetingRecorder.desktop
          bsdtar -tf arch-build/*.pkg.tar.zst | grep -q usr/share/icons/hicolor/256x256/apps/meeting-recorder.png
          echo "All required paths present in pacman package"

  # ── arm64 install smoke test ────────────────────────────────────────────────
  #
  # The .deb is Architecture: all and the APT repo advertises arm64, but x86
  # runners never prove it. Build the package natively, then install and
  # import it inside a QEMU-emulated arm64 container.
  deb-arm64-smoke:
    name: .deb install smoke test (arm64)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v6

      - name: Build .deb (arch-independent)
        run: |
          STAGING=$(mktemp -d)
          mkdir -p "$STAGING/DEBIAN" "$STAGING/opt/meeting-recorder/linux/src" \
                   "$STAGING/usr/bin" "$STAGING/usr/share/applications"
          cp -r linux/src/. "$STAGING/opt/meeting-recorder/linux/src/"
          cp linux/requirements.txt linux/requirements.lock "$STAGING/opt/meeting-recorder/"
          cp linux/packaging/usr/bin/meeting-recorder "$STAGING/usr/bin/meeting-recorder"
          chmod 755 "$STAGING/usr/bin/meeting-recorder"
          cp linux/packaging/usr/share/applications/io.github.dipakmdhrm.MeetingRecorder.desktop \
             "$STAGING/usr/share/applications/"
          for f in postinst prerm postrm; do
            cp "linux/packaging/DEBIAN/$f" "$STAGING/DEBIAN/$f"
            chmod 755 "$STAGING/DEBIAN/$f"
          done
          sed "s/@VERSION@/0.0.0/" linux/packaging/DEBIAN/control.template \
            > "$STAGING/DEBIAN/control"
          dpkg-deb --build "$STAGING" meeting-recorder.deb

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install and import under arm64
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD/meeting-recorder.deb:/tmp/meeting-recorder.deb:ro" \
            ubuntu:24.04 bash -ec '
              uname -m
              apt-get update -qq
              apt-get install -y /tmp/meeting-recorder.deb
              PYTHONPATH=/opt/meeting-recorder/linux/src \
                /opt/meeting-recorder/venv/bin/python -c "
          import gi
          gi.require_version(\"Gtk\", \"4.0\")
          gi.require_version(\"Adw\", \"1\")
          from gi.repository import Gtk, Adw
          import google.genai
          import meeting_recorder
          print(\"arm64: GTK4 + Adw typelibs, venv deps, and app package import OK\")
          "
            '

  # ── Android unit tests + debug build ────────────────────────────────────────
  #
  # Unit tests run on the JVM — no emulator or device required.
  # assembleDebug verifies the full Kotlin/Compose compile succeeds.
  build-android:
    name: Android unit tests + debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK platform + build tools
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" "build-tools;35.0.0"

      - name: Kotlin lint (ktlint)
        working-directory: android
        run: ./gradlew ktlintCheck --no-daemon

      - name: Run unit tests
        working-directory: android
        run: ./gradlew test --no-daemon

      - name: Coverage report (Jacoco, report-only)
        working-directory: android
        run: ./gradlew jacocoDebugUnitTestReport --no-daemon

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: android-coverage
          path: android/app/build/reports/jacoco/jacocoDebugUnitTestReport/

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK exists
        run: ls -lh android/app/build/outputs/apk/debug/app-debug.apk
