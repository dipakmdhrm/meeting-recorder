[tool.pytest.ini_options]
testpaths = ["linux/tests"]
pythonpath = ["linux/src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["linux/src"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "W",  # pycodestyle warnings
    "I",  # isort
    "UP", # pyupgrade
    "B",  # bugbear
]
ignore = [
    # PyGObject requires gi.require_version() calls before any
    # `from gi.repository import ...`, so imports can't all sit at the top.
    "E402",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

# Strict typing on the headless, unit-tested layers. UI/audio/detection are
# GTK-bound and checked leniently until they grow extracted core logic.
[[tool.mypy.overrides]]
module = [
    "meeting_recorder.processing.*",
    "meeting_recorder.services.*",
    "meeting_recorder.config.*",
]
strict = true
